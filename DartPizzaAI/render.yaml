services:
  - type: web
    name: dart-pizza-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: DART_DB
        value: /var/data/dartpizza.db
      - key: DART_SEED_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
    disk:
      name: dart-pizza-data
      mountPath: /var/data
      sizeGB: 1
